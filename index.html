<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Jake's Showcase</title>
</head>

<body>

    <section class="hero">
        <div class="hero-overlay">
            <h1 class="hero-text">Welcome to My Showcase</h1>
        </div>
    </section>

    <section class="topic">

        <div class="tab-container">
            <button class="tab-button tab-red active" onclick="openWork(event, 'ImageEditing')">Image Editing</button>
            <button class="tab-button tab-blue" onclick="openWork(event, 'Coding')">Coding</button>
            <button class="tab-button tab-green" onclick="openWork(event, 'Other')">Other Work</button>
        </div>

        <div id="ImageEditing" class="tab-content" style="display: block;">
            <div class="topic-content">
                <div class="topic-card card-red">
                    <img src="images/unnamed.png" alt="Snowflake">
                    <h2 class="topic-card-text">Snowflake</h2>
                </div>
                <div class="topic-card card-red">
                    <img src="images/backround.png" alt="Background">
                    <h2 class="topic-card-text">Creation</h2>
                </div>
                <div class="topic-card card-red">
                    <img src="images/Y10 CS_ 1.6 Binary & Hex - PaintByNumbers_Dragon_wHexcodes.png" alt="Dragon">
                    <h2 class="topic-card-text">Hex Dragon</h2>
                </div>
            </div>
        </div>

<div id="Coding" class="tab-content">
            <div class="topic-content">
                <div class="topic-card card-blue">
                    <video autoplay loop muted playsinline>
                        <source src="images/hei matau0000-0250.mp4" type="video/mp4">
                        Your browser does not support the video tag.
                    </video>
                    <h2 class="topic-card-text">Hei matau</h2>
                </div>
                <div class="topic-card card-blue">
                    <img src="images/Capture.PNG" alt="Website">
                    <h2 class="topic-card-text">Grok Completion</h2>
                </div>
                <div class="topic-card card-blue">
                    <img src="images/Flower.PNG" alt="Game">
                    <h2 class="topic-card-text">Python flower</h2>
                </div>
            </div>
        </div>

        <div id="Other" class="tab-content">
            <div class="topic-content">
                <div class="topic-card card-green">
                <video autoplay loop muted playsinline>
                        <source src="images/movie0001-0130.mp4" type="video/mp4">
                </video>
                <h2 class="topic-card-text">Blender Animation</h2>
                </div>
                <div class="topic-card card-green">
                <video autoplay loop muted playsinline>
                        <source src="images/ezgif-2d7431ce2a7ca82c.mp4" type="video/mp4">
                </video>
                <h2 class="topic-card-text">Ronaldo Edit</h2>
                </div>
                <div class="topic-card card-green">
                    <img src="images/placeholder-1024x1024.png" alt="Music">
                    <h2 class="topic-card-text">Placeholder</h2>
                </div>
            </div>
        </div>

    </section>

    <footer class="footer">
        <p>&copy; 2026 My Showcase Website By Jake</p>
    </footer>

    <script>
        function openWork(evt, workCategory) {
            // Step 1: Hide all content smoothly
            let tabContents = document.getElementsByClassName("tab-content");
            for (let i = 0; i < tabContents.length; i++) {
                tabContents[i].style.display = "none";
            }

            // Step 2: Remove the "active" class from ALL buttons safely
            let tabButtons = document.getElementsByClassName("tab-button");
            for (let i = 0; i < tabButtons.length; i++) {
                tabButtons[i].classList.remove("active");
            }

            // Step 3: Show the specific tab you clicked and make its button active
            document.getElementById(workCategory).style.display = "block";
            evt.currentTarget.classList.add("active");
        }
    </script>

</body>
</html>
